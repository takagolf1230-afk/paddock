<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="パドック記録">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>パドック記録 | Logic Horse</title>
<style>
:root { --bg:#0b0b0b; --panel:#15130c; --line:#3a3115; --gold:#e1b246; --text:#e8e2d0; --mute:#9b8a63; --good:#2f8a55; --bad:#b4483a; --g1:#e1b246; --g2:#6bd18a; --g3:#9a9a9a; --g4:#ff7a66; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; font-size:16px; }
body { padding:env(safe-area-inset-top) 12px calc(88px + env(safe-area-inset-bottom)) 12px; max-width:720px; margin:0 auto; }
button { font:inherit; color:inherit; background:#1d1a10; border:1px solid #5a4a1f; border-radius:10px; padding:10px 12px; }
button:active { background:#2c2614; }
select,textarea,input[type=text] { font:inherit; color:var(--text); background:#111; border:1px solid var(--line); border-radius:10px; padding:10px; width:100%; }
.top { position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 0; border-bottom:1px solid var(--line); }
.row { display:flex; gap:8px; align-items:center; }
.row > * { flex:0 0 auto; }
.row .grow { flex:1 1 auto; min-width:0; }
.nav { display:flex; gap:6px; margin-top:8px; }
.nav button { flex:1; padding:8px 4px; font-size:14px; }
.nav button.on { background:var(--gold); color:#0b0b0b; border-color:var(--gold); font-weight:700; }
.seg { display:flex; gap:6px; margin-top:8px; }
.seg button { flex:1; }
.seg button.on { background:var(--gold); color:#0b0b0b; font-weight:700; border-color:var(--gold); }
.banner { margin:10px 0; padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:12px; font-size:14px; line-height:1.55; }
.banner b { color:var(--gold); }
.warn { color:#ff8a6b; }
.mute { color:var(--mute); font-size:13px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px; margin:10px 0; }
.card.saved { opacity:.78; }
.hd { display:flex; align-items:center; gap:8px; }
.no { min-width:34px; height:34px; border-radius:9px; background:#26210f; border:1px solid #5a4a1f; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; }
.nm { flex:1; font-weight:700; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pill { font-size:13px; padding:3px 8px; border-radius:999px; border:1px solid var(--line); white-space:nowrap; }
.pill.ls { border-color:var(--gold); color:var(--gold); }
.more { padding:6px 10px; }
.notes { margin:6px 0 0; font-size:12.5px; color:var(--mute); line-height:1.5; }
.notes .p { color:#7fd69b; } .notes .m { color:#ff9a8a; }
.grades { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:8px; }
.grades button { font-size:24px; padding:10px 0; }
.grades button.on[data-g="◎"] { background:var(--g1); color:#0b0b0b; border-color:var(--g1); }
.grades button.on[data-g="○"] { background:var(--g2); color:#0b0b0b; border-color:var(--g2); }
.grades button.on[data-g="△"] { background:var(--g3); color:#0b0b0b; border-color:var(--g3); }
.grades button.on[data-g="×"] { background:var(--g4); color:#0b0b0b; border-color:var(--g4); }
.gl { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; font-size:11px; color:var(--mute); text-align:center; margin-top:2px; }
.chk { margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; }
.item { margin:8px 0; }
.item .lb { font-size:14px; font-weight:600; }
.item .hint { font-size:11.5px; color:var(--mute); }
.tri { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:4px; }
.tri button { padding:8px 0; font-size:15px; }
.tri button.on[data-v="1"] { background:var(--good); border-color:var(--good); color:#fff; }
.tri button.on[data-v="0"] { background:#444; border-color:#666; }
.tri button.on[data-v="-1"] { background:var(--bad); border-color:var(--bad); color:#fff; }
.tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.tags button { padding:7px 10px; font-size:14px; }
.tags button.g { border-color:#2f6b45; background:#14241a; } .tags button.g.on { background:var(--good); color:#fff; }
.tags button.b { border-color:#7a3b30; background:#2a1714; } .tags button.b.on { background:var(--bad); color:#fff; }
.bar { position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:rgba(11,11,11,.96); border-top:1px solid var(--line); }
.bar .in { max-width:720px; margin:0 auto; display:flex; gap:8px; }
.bar button { flex:1; font-weight:700; }
.bar .primary { background:var(--gold); color:#0b0b0b; border-color:var(--gold); }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th,td { border-bottom:1px solid var(--line); padding:6px 4px; text-align:center; vertical-align:top; }
th { color:var(--gold); font-weight:600; }
td.l,th.l { text-align:left; }
tr.hot td { background:rgba(47,138,85,.18); } tr.cold td { background:rgba(180,72,58,.18); }
h2 { font-size:17px; color:var(--gold); margin:16px 0 6px; }
.toast { position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top)); transform:translateX(-50%); background:#2c2614; border:1px solid var(--gold); border-radius:12px; padding:10px 14px; z-index:20; max-width:90%; font-size:14px; }
a { color:var(--gold); }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
